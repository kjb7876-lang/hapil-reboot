<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07070f">
  <meta name="description" content="합일 ARCADE. 원작 56장면을 한 스테이지씩 잇는 원큐 여정 세로 탄막 슈팅.">
  <title>합일 — 총집본</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0b14'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='none' stroke='%23d8c49a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23d8c49a'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#000;color:#f0e9d8;font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
    body{display:flex;justify-content:center;background:transparent} /* 뒤의 #arcade-bleed가 보이게 */
    #arcade-stage{position:relative;width:100%;height:100dvh;max-width:calc(100dvh*360/640);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    canvas{display:block;background:#07070f}
    #arcade-bleed{position:fixed;inset:-24px;z-index:-1;background:#000 center/cover no-repeat;filter:blur(14px) brightness(.38) saturate(.8)} /* 플레이 칸 밖 여백: 스테이지 그림을 흐리게 */
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:rgba(5,5,14,.72)}
    .screen[hidden]{display:none}
    h1{margin:0;font:600 44px/1.1 "Noto Serif KR","Nanum Myeongjo",serif;letter-spacing:.12em;color:#fff3cf}
    h2{margin:0;font:600 30px/1.2 "Noto Serif KR","Nanum Myeongjo",serif;letter-spacing:.08em;color:#fff3cf}
    .kicker{margin:0;font-size:11px;letter-spacing:.32em;color:#d8c49a}
    #arcade-title{gap:11px;background:radial-gradient(120% 70% at 50% 18%,rgba(74,52,110,.5),rgba(5,5,14,.86) 62%)}
    #arcade-title h1{font-size:54px;text-shadow:0 0 28px rgba(216,196,154,.45)}
    .note{margin:0;font-size:12.5px;color:#b8b4c8}
    .score{font:600 34px/1 ui-monospace,Menlo,monospace;color:#fff}
    .row{display:flex;gap:8px}
    button,a.button{appearance:none;border:1px solid #4a4666;background:#15152a;color:inherit;font:inherit;border-radius:10px;padding:12px 16px;min-width:88px;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button[aria-pressed="true"]{border-color:#d8c49a;background:#3a2f4a;color:#fff3cf}
    button.primary{background:#d8c49a;color:#17131f;border-color:#d8c49a;font-weight:600;min-width:220px;min-height:54px;font-size:17px}
    button:disabled{opacity:.5}
    #arcade-frame{position:relative}
    #arcade-pause-button{position:absolute;top:8.6%;left:2.6%;min-width:44px;min-height:36px;padding:0;background:rgba(10,10,24,.45);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.8)}
    #arcade-pause-button[hidden],.pad[hidden]{display:none}
    .pad{position:absolute;bottom:1.6%;width:68px;height:56px;min-width:0;padding:0;border-radius:14px;background:rgba(10,10,24,.5);border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.88);font-size:13px;touch-action:none}
    #arcade-focus{left:2.6%}#arcade-bomb{right:2.6%;border-color:rgba(125,255,176,.55)}
    .pad:active{background:rgba(216,196,154,.4)}
    /* 플레이 칸 밖 HUD: 휴대폰은 위아래 여백, PC는 좌우 패널(app의 placeHud가 자리를 잡는다) */
    .hudx{position:fixed;z-index:3;display:flex;gap:10px;pointer-events:none;font:12px/1.35 system-ui,"Apple SD Gothic Neo",sans-serif;color:rgba(255,255,255,.82);text-shadow:0 1px 2px #000}
    .hudx[hidden]{display:none}
    .hudx .name{font-weight:600}.hudx .lives{color:#ff6a8a;font-size:14px;letter-spacing:1px}.hudx .bombs{color:#7dffb0;font-size:14px}.hudx .score{font-weight:600;font-size:15px;color:#fff}.hudx .graze{font-size:10px;opacity:.75}
    .hudx .gauge{width:64px;height:3px;background:rgba(255,255,255,.18)}.hudx .gauge i{display:block;height:3px;background:#7dffb0}
    .hudx.below{align-items:center;justify-content:space-between;padding:0 12px}.hudx.side{flex-direction:column;justify-content:flex-start;gap:16px;padding:16px 18px;box-sizing:border-box;background:linear-gradient(180deg,rgba(14,10,22,.82),rgba(6,4,10,.72));border:1px solid rgba(214,180,120,.45);border-radius:4px;box-shadow:0 0 24px rgba(0,0,0,.6);font-size:14px}
    .hudx.side .name{font-size:16px}.hudx.side .lives{font-size:20px}.hudx.side .bombs{font-size:18px}.hudx.side .score{font-size:24px;letter-spacing:1px}.hudx.side .graze{font-size:12px}.hudx.side .gauge{width:100px;height:4px;margin-top:4px}.hudx.side .gauge i{height:4px}
    .hudx .lbl{font-size:10px;letter-spacing:2px;color:rgba(214,180,120,.85);margin-top:6px}
    select{appearance:none;border:1px solid #4a4666;background:#15152a;color:inherit;font:inherit;border-radius:10px;padding:10px 14px;min-height:44px;max-width:100%}
    .screen{overflow-y:auto}
    #arcade-title{justify-content:flex-start;padding-top:max(28px,6dvh)}
    #arcade-title>*{flex-shrink:0}
    .row.pick{width:100%;max-width:320px}.row.pick select{flex:1;min-width:0}
    #continue-note{margin-top:-8px}
    .keepsakes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%;max-width:340px}
    .keepsake{aspect-ratio:1;border:1px solid #4a4666;border-radius:8px;background:#15152a;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:9px;line-height:1.1;color:#d8c49a;padding:2px}
    .keepsake img{max-width:100%;max-height:100%;object-fit:contain}
    .keepsake .sheet{height:100%;max-width:100%;background-repeat:no-repeat;background-position:0 0}
    .keepsake.locked{background:repeating-linear-gradient(45deg,#101020 0 6px,#16162a 6px 12px);color:#55506e;font-size:14px}
  </style>
</head>
<body>
  <div id="arcade-bleed" aria-hidden="true"></div>
  <div id="arcade-hud-high" class="hudx" aria-live="off" hidden></div>
  <div id="arcade-hud-low" class="hudx" aria-live="off" hidden></div>
  <div id="arcade-stage">
    <div id="arcade-frame">
      <canvas id="arcade-canvas" width="360" height="640" aria-label="세로 탄막 전투장"></canvas>
      <button id="arcade-pause-button" type="button" aria-label="일시정지" hidden>Ⅱ</button>
      <button id="arcade-focus" class="pad" type="button" aria-label="저속 이동 (누르고 있는 동안)" hidden>저속</button>
      <button id="arcade-bomb" class="pad" type="button" aria-label="폭탄" hidden>폭탄</button>
    </div>

    <div id="arcade-title" class="screen">
      <p class="kicker">HAPIL · 원큐 여정 · 56 STAGES</p>
      <h1>합일</h1>
      <p class="note">끌어서 이동 · 공격은 자동<br><b>저속</b>을 누르면 느려지고 피격점이 보입니다 · <b>폭탄</b>은 탄을 지웁니다</p>
      <button id="arcade-continue" type="button" hidden>이어하기</button>
      <p class="note" id="continue-note" hidden></p>
      <button id="arcade-start" class="primary" type="button" data-mode="full" disabled>불러오는 중…</button>
      <div class="row pick">
        <select id="arcade-stage-select" aria-label="스테이지 선택"></select>
        <button id="arcade-stage-go" type="button">여기서</button>
      </div>
      <div class="row" role="group" aria-label="난이도">
        <button type="button" data-difficulty="gentle" aria-pressed="false">여유</button>
        <button type="button" data-difficulty="normal" aria-pressed="true">기본</button>
        <button type="button" data-difficulty="hell" aria-pressed="false">지옥</button>
      </div>
      <p class="note" id="difficulty-note"></p>
      <div class="row">
        <button id="arcade-keepsakes" type="button">기념물</button>
        <button id="arcade-boss-open" type="button" data-mode="boss">보스 체험</button>
        <button id="arcade-sound" type="button" aria-pressed="true">소리 켜짐</button>
      </div>
      <p class="note">별 <b id="title-stars">0</b> / <span id="title-stars-max">168</span> · 최고 점수 <b id="title-best">00000000</b></p>
      <p class="note" id="save-note" hidden>이 브라우저에서는 기록을 저장할 수 없습니다.</p>
    </div>

    <div id="arcade-boss-screen" class="screen" hidden>
      <p class="kicker">BOSS PRACTICE</p>
      <h2>보스 체험</h2>
      <p class="note" id="mode-note"></p>
      <select id="arcade-boss-select" aria-label="보스 스테이지"></select>
      <button id="arcade-boss-start" class="primary" type="button">시작</button>
      <button id="arcade-boss-back" type="button">돌아가기</button>
    </div>

    <div id="arcade-keepsake-screen" class="screen" hidden>
      <p class="kicker">KEEPSAKES</p>
      <h2>기념물</h2>
      <p class="note" id="keepsake-count"></p>
      <div id="arcade-keepsake-grid" class="keepsakes"></div>
      <button id="arcade-keepsake-back" type="button">돌아가기</button>
    </div>

    <div id="arcade-pause" class="screen" hidden>
      <p class="kicker">PAUSED</p>
      <h2>잠시 멈춤</h2>
      <button id="arcade-resume" class="primary" type="button">계속하기</button>
      <button id="arcade-quit" type="button">처음 화면으로</button>
    </div>

    <div id="arcade-result" class="screen" hidden>
      <p class="kicker">RESULT</p>
      <h2 id="result-title">GAME OVER</h2>
      <div class="score" id="result-score">00000000</div>
      <p class="note" id="result-detail"></p>
      <p class="note">최고 점수 <b id="result-best">00000000</b></p>
      <button id="arcade-retry" class="primary" type="button">이 스테이지부터 다시</button>
      <button id="arcade-home" type="button">처음 화면으로</button>
    </div>
  </div>
  <script src="src/audio-v37.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p1.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p2.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p3.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p4.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p5.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p6.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p7.js?v=20261113-arcade43"></script>
  <script src="src/arcade-parts-v43/p8.js?v=20261113-arcade43"></script>
  <script src="src/arcade-v43.js?v=20261113-arcade43"></script>
  <script src="src/arcade-skins-v43.js?v=20261113-arcade43"></script>
  <script src="src/arcade-app-v43.js?v=20261113-arcade43"></script>
</body>
</html>
