<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07070f">
  <meta name="description" content="합일 ARCADE. 구슬탄 수백 발을 스치며 버티는 세로 탄막 슈팅.">
  <title>합일 — ARCADE 탄막</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0b14'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='none' stroke='%23d8c49a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23d8c49a'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#000;color:#f0e9d8;font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
    body{display:flex;justify-content:center}
    #arcade-stage{position:relative;width:100%;height:100dvh;max-width:calc(100dvh*360/640);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    canvas{display:block;background:#07070f}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:rgba(5,5,14,.72)}
    .screen[hidden]{display:none}
    h1{margin:0;font:600 44px/1.1 "Noto Serif KR","Nanum Myeongjo",serif;letter-spacing:.12em;color:#fff3cf}
    h2{margin:0;font:600 30px/1.2 "Noto Serif KR","Nanum Myeongjo",serif;letter-spacing:.08em;color:#fff3cf}
    .kicker{margin:0;font-size:11px;letter-spacing:.32em;color:#d8c49a}
    .note{margin:0;font-size:12.5px;color:#b8b4c8}
    .score{font:600 34px/1 ui-monospace,Menlo,monospace;color:#fff}
    .row{display:flex;gap:8px}
    button,a.button{appearance:none;border:1px solid #4a4666;background:#15152a;color:inherit;font:inherit;border-radius:10px;padding:12px 16px;min-width:88px;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    button[aria-pressed="true"]{border-color:#d8c49a;background:#3a2f4a;color:#fff3cf}
    button.primary{background:#d8c49a;color:#17131f;border-color:#d8c49a;font-weight:600;min-width:220px;min-height:54px;font-size:17px}
    button:disabled{opacity:.5}
    #arcade-frame{position:relative}
    #arcade-pause-button{position:absolute;top:5.5%;left:50%;transform:translateX(-50%);min-width:44px;min-height:36px;padding:0;background:rgba(10,10,24,.45);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.8)}
    #arcade-pause-button[hidden]{display:none}
  </style>
</head>
<body>
  <div id="arcade-stage">
    <div id="arcade-frame">
      <canvas id="arcade-canvas" width="360" height="640" aria-label="세로 탄막 전투장"></canvas>
      <button id="arcade-pause-button" type="button" aria-label="일시정지" hidden>Ⅱ</button>
    </div>

    <div id="arcade-title" class="screen">
      <p class="kicker">HAPIL · ARCADE DANMAKU</p>
      <h1>합일</h1>
      <p class="note">보스 셋, 스펠 여섯. 화면을 끌어 탄 사이를 지나세요.<br>공격은 자동이고, 흰 점만 맞지 않으면 됩니다.</p>
      <div class="row" role="group" aria-label="난이도">
        <button type="button" data-difficulty="gentle" aria-pressed="false">여유</button>
        <button type="button" data-difficulty="normal" aria-pressed="true">기본</button>
        <button type="button" data-difficulty="hell" aria-pressed="false">지옥</button>
      </div>
      <button id="arcade-start" class="primary" type="button" disabled>불러오는 중…</button>
      <p class="note">최고 점수 <b id="title-best">00000000</b></p>
      <div class="row">
        <button id="arcade-sound" type="button" aria-pressed="true">소리 켜짐</button>
        <a class="button" href="index.html">스토리 모드</a>
      </div>
    </div>

    <div id="arcade-pause" class="screen" hidden>
      <p class="kicker">PAUSED</p>
      <h2>잠시 멈춤</h2>
      <button id="arcade-resume" class="primary" type="button">계속하기</button>
      <button id="arcade-quit" type="button">처음 화면으로</button>
    </div>

    <div id="arcade-result" class="screen" hidden>
      <p class="kicker">RESULT</p>
      <h2 id="result-title">GAME OVER</h2>
      <div class="score" id="result-score">00000000</div>
      <p class="note" id="result-detail"></p>
      <p class="note">최고 점수 <b id="result-best">00000000</b></p>
      <button id="arcade-retry" class="primary" type="button">다시 도전</button>
      <a class="button" href="index.html">스토리 모드</a>
    </div>
  </div>
  <script src="src/audio-v37.js?v=20261113-arcade38"></script>
  <script src="src/arcade-v38.js?v=20261113-arcade38"></script>
  <script src="src/arcade-app-v38.js?v=20261113-arcade38"></script>
</body>
</html>
