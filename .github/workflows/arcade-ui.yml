name: Arcade UI regression
on:
  pull_request:
    paths:
      - 'arcade.html'
      - 'src/**'
      - 'tests/**'
      - 'tools/check-arcade-ui-v43.cjs'
      - 'package.json'
      - '.github/workflows/arcade-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test tests/arcade-v43-part${{ matrix.part }}.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-ui-results
          path: artifacts/arcade-ui/
          retention-days: 14
