<!doctype html><html lang="ko"><meta charset="utf-8"><title>v25 개별 자산 탄환 검수</title><style>body{background:#0e1621;color:#eee;font:14px sans-serif;margin:18px}h1{font-size:22px;margin:0 0 8px}p{max-width:1080px;line-height:1.5;margin:6px 0}button,select{padding:7px;background:#283446;color:#fff;border:1px solid #79869c;margin:3px}#view{display:flex;gap:24px;margin-top:10px}#holder{width:360px;height:640px;flex:0 0 360px}#arena{display:block;width:360px;height:640px}pre{width:650px;max-height:440px;overflow:auto;white-space:pre-wrap;font-size:12px}#props img{width:120px;height:120px;object-fit:contain}#props span{display:inline-block;text-align:center}#playback{font-weight:bold;color:#e7bca6}</style><h1>v25 합일1 개별 탄환 검수</h1><p>실제 후보 코드·자산과 실제 코어의 선택한 페이즈 관찰입니다. 자동 공격·스킬을 끄고 피해 면역을 사용합니다. 자연 진행·모바일 FPS 검사가 아닙니다.</p><label>보스 <select id="scene"><option value="0">1 · 보라검천사</option><option value="1">2 · 뿔악마</option><option value="2">3 · 발록</option><option value="3">4 · 웃는 가면</option><option value="4">5 · 루시퍼</option><option value="5" selected>6 · 나태</option><option value="6">7 · 질투</option><option value="7">8 · 탐식</option><option value="8">9 · 색욕</option><option value="9">10 · 탐욕</option><option value="10">11 · 분노</option><option value="11">12 · 교만</option><option value="12">13 · 방어의 군단</option><option value="13">14 · 잔인한 구원</option><option value="14">15 · 거부권</option><option value="15">16 · 관리자 권한</option><option value="16">17 · 이주실</option><option value="17">18 · 기억의 문</option><option value="18">19 · 고블린 두목</option><option value="19">20 · 타락천사 기사</option><option value="20">21 · 불면귀</option><option value="21">22 · 최초명령 코어 방어</option><option value="22">23 · 동력 연결</option><option value="23">24 · 교차 명령</option><option value="24">25 · 검은 공방</option><option value="25">26 · 뉴런 게이트</option><option value="26">27 · 망각의 묘지</option><option value="27">28 · 여섯 명령 고리</option><option value="28">29 · 아르벨리아 해방</option><option value="29">30 · 세이렌 모르</option><option value="30">31 · 악몽 우두머리</option><option value="31">32 · 파란불 집행체</option><option value="32">33 · 흑장미단 회로</option><option value="33">34 · 한리안·백이온</option><option value="34">35 · 사이보그 교주</option></select></label><label>페이즈 <select id="phase"><option value="2">3</option><option value="0">1</option><option value="1">2</option></select></label><label>난도 <select id="difficulty"><option value="hell">HELL</option><option value="normal">NORMAL</option><option value="gentle">GENTLE</option></select></label><label>품질 <select id="quality"><option value="high">고품질</option><option value="low">절전</option></select></label><button data-mode="warning">고정 시전 예고</button><button data-mode="release">고유 공격 방출</button><button data-mode="mixed">공격 중첩</button><button data-mode="peak">중첩 최다</button><button id="advance">15틱 진행</button><button id="export-proof">캔버스 PNG 내보내기</button><button id="export-observations">검수 JSON 내보내기</button><p id="playback">필수 자산 로드</p><div id="view"><div id="holder"><canvas id="arena" width="360" height="640"></canvas></div><div><div id="props" style="display:none"><span><img src="media/projectiles-hapil1-v25/lust-heel.webp"><br>하이힐</span><span><img src="media/projectiles-hapil1-v25/lust-lipstick.webp"><br>립스틱</span><span><img src="media/projectiles-hapil1-v25/lust-broken-heart.webp"><br>깨진 하트</span></div><pre id="status">로딩</pre></div></div><script src="src/media.js?v=20261031-identity25review"></script><script src="src/weapon-patterns.js?v=20261031-identity25review"></script><script src="src/core.js?v=20261031-identity25review"></script><script src="src/boss-motion.js?v=20261031-identity25review"></script><script src="src/story-assets.js?v=20261031-identity25review"></script><script src="src/actors.js?v=20261031-identity25review"></script><script src="src/projectiles.js?v=20261031-identity25review"></script><script src="src/boss-skills.js?v=20261031-identity25review"></script><script src="src/render.js?v=20261031-identity25review"></script><script>var global=window;
  function mobileAssetKeys(group){
    var enemyNames=group>=12?[]:group>=5?['Guard','Denial']:([['Spider'],['Swamp'],['Ember'],['Echo','Vial'],['Guard','Denial']][group]||[]);
    var motionKeys=['bossMotionViolet','bossMotionHorn','bossMotionBalrog','bossMotionMask','bossMotionLucifer'];

    var sinKeys=group>=19&&global.HapilStoryAssets&&global.HapilStoryAssets.assetKeysForEncounter?global.HapilStoryAssets.assetKeysForEncounter(group):group>=13&&global.HapilActors&&global.HapilActors.chapter3AssetKeysForEncounter?global.HapilActors.chapter3AssetKeysForEncounter(group):group===12&&global.HapilActors&&global.HapilActors.cultAssetKeysForEncounter?global.HapilActors.cultAssetKeysForEncounter(group):group>=5&&global.HapilActors&&global.HapilActors.sinAssetKeysForEncounter?global.HapilActors.sinAssetKeysForEncounter(group):[];

    var skillKeys=global.HapilBossSkills&&global.HapilBossSkills.assetKeysForEncounter?global.HapilBossSkills.assetKeysForEncounter(group):[];
    if(global.HapilBossSkills&&global.HapilBossSkills.optionalAssetKeysForEncounter)skillKeys=skillKeys.concat(global.HapilBossSkills.optionalAssetKeysForEncounter(group));
    return Object.keys(global.HapilMedia).filter(function(k){
      // These legacy body/floor images are unused by the source-backed controller scenes.
      if(group>=13&&['boss','spider','cave'].includes(k))return false;
      if(group>=19&&k==='gunner'&&global.HapilStoryAssets&&global.HapilStoryAssets.lookup(group)&&global.HapilStoryAssets.lookup(group).player)return false;
      if(group>=19&&k==='fxWindArrow8V6'&&global.HapilStoryAssets&&global.HapilStoryAssets.lookup(group)&&global.HapilStoryAssets.lookup(group).playerShot)return false;
      if(['gunner','boss','spider','fxResonance','fxSlash','fxThorns','fxArrow','fxParry','fxSilk','fxWindArrow8V6'].includes(k))return true;
      if(group===0&&(/^map\d+$/.test(k)||k==='violetCutin'))return true;
      if(group>=5&&k==='cave')return true;
      if((group===-1||group===1||group===2)&&['forest','ruins','cave'].includes(k))return true;
      if(k===motionKeys[group]||fxKeys.indexOf(k)>=0||sinKeys.indexOf(k)>=0||terrainKeys.indexOf(k)>=0||skillKeys.indexOf(k)>=0)return true;
      return enemyNames.some(function(n){return k.indexOf('actor'+n)===0;});

const sel=document.querySelector('#scene'),status=document.querySelector('#status'),buttons=[...document.querySelectorAll('button')];let renderer=null,images={},generation=0,states={},currentMode='warning',currentWorld=null;
async function load(){const gen=++generation,bossIndex=+sel.value,index=bossIndex>=18?bossIndex+1:bossIndex>=12?bossIndex+1:bossIndex;buttons.forEach(b=>b.disabled=true);status.textContent='필수 이미지 준비 중';if(renderer)renderer.destroy();renderer=null;const keys=mobileAssetKeys(index),bag={};let cursor=0;async function worker(){while(cursor<keys.length){const k=keys[cursor++];bag[k]=await new Promise((ok,no)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=()=>no(Error(k));im.src=HapilMedia[k]})}}try{await Promise.all([worker(),worker()]);if(gen!==generation)return;const err=HapilProjectiles.invalidAssetForEncounter(bag,index);if(err)throw Error(err);images=bag;renderer=HapilRenderer.create(document.querySelector('#arena'),images);renderer.resize(360,640,1);states={};const original=HapilCore.createRun({campaign:true,campaignRevision:5,practiceBoss:true,bossIndex:bossIndex,combatRevision:25,difficulty:document.querySelector('#difficulty').value,seed:813,runId:'v25-browser-prop-fixture'}),cp=HapilCore.checkpoint(original);cp.phase=+document.querySelector('#phase').value;const w=HapilCore.restoreCheckpoint(cp);w.autoAttack=false;w.skillRotation=false;w.player.invulnerableUntil=999999;let peak=-1;for(let t=0;t<1200;t++){HapilCore.step(w,{});if(w.stage!=='boss')break;const rotors=w.bullets.filter(b=>b.kind==='hell-rotor');if(!states.warning&&w.boss.identityCasts?.some(c=>w.tick-c.warningAt>=12))states.warning=structuredClone(w);if(!states.release&&w.bullets.some(b=>b.identityRole)&&w.tick>140)states.release=structuredClone(w);if(!states.mixed&&w.bullets.some(b=>b.identityRole)&&w.tick>=300)states.mixed=structuredClone(w);const score=w.bullets.length;if(score>peak){peak=score;states.peak=structuredClone(w)}}buttons.forEach(b=>b.disabled=false);show(currentMode)}catch(e){status.textContent='FAIL '+e.message}}
function paint(w,mode){renderer.draw(w,0,w.time,document.querySelector('#quality').value==='low');const m=renderer.getMetrics();document.querySelector('#playback').textContent=mode+' · tick '+w.tick+' · 면역 fixture';status.textContent=JSON.stringify({mode,bossIndex:+sel.value,phase:w.phase,difficulty:w.difficulty,quality:document.querySelector('#quality').value,tick:w.tick,assets:Object.keys(images).length,bullets:w.bullets.length,rotors:w.bullets.filter(b=>b.kind==='hell-rotor').map(b=>({id:b.id,spinRate:b.spinRate,spinAngle:b.spinAngle,paletteSlot:b.paletteSlot,bounceCount:b.bounceCount,r:b.r,x:b.x,y:b.y,patternId:b.patternId})),projectiles:m.projectilePresentation,identityCasts:w.boss.identityCasts||[],skills:m.bossSkillsPresentation,actor:m.actorPresentation?.lastSinSample,hp:w.player.hp},null,2)}
function show(mode){currentMode=mode;const chosen=states[mode]?mode:'peak';if(!renderer||!states[chosen])return;currentWorld=structuredClone(states[chosen]);paint(currentWorld,chosen)}buttons.forEach(b=>b.onclick=()=>show(b.dataset.mode));document.querySelector('#advance').onclick=()=>{if(!currentWorld)return;for(let n=0;n<15;n++)HapilCore.step(currentWorld,{});paint(currentWorld,'15틱 진행')};function saveProof(blob,name){const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}document.querySelector('#export-proof').onclick=()=>document.querySelector('#arena').toBlob(blob=>saveProof(blob,'hapil-v25-browser-canvas.png'),'image/png');document.querySelector('#export-observations').onclick=()=>saveProof(new Blob([JSON.stringify({scope:'Actual Chrome canvas presentation fixture, immune, not natural/mobile FPS',canvasCSS:document.querySelector('#arena').getBoundingClientRect().toJSON(),current:JSON.parse(status.textContent)},null,2)],{type:'application/json'}),'hapil-v25-browser-observations.json');document.querySelector('#quality').onchange=()=>paint(currentWorld,currentMode);sel.onchange=load;document.querySelector('#difficulty').onchange=load;document.querySelector('#phase').onchange=load;load();</script></html>
